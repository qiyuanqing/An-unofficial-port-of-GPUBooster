# neoforge.mods.toml for Rapidyne (Unofficial GPUBooster Port)
#
# Unofficial NeoForge port of GPUBooster by Mr.Toad (https://github.com/ITsMrToad/GPUBooster),
# originally a Fabric mod for Minecraft 1.21.1, licensed GPL-3.0.
# This port targets NeoForge 26.1.2 and carries the same GPL-3.0 license (see LICENSE).
# Not affiliated with or endorsed by the original author.

license="${mod_license}"

issueTrackerURL="https://github.com/ITsMrToad/GPUBooster/issues"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

logoFile="icon.png"

authors="qiyuanqing (unofficial NeoForge 26.1.2 port); Mr.Toad (original GPUBooster mod, not affiliated with this port)"

description='''
Rapidyne is an unofficial NeoForge 26.1.2 port of GPUBooster. It carries over the
loader-agnostic performance pieces (fast math, fast random) that don't depend on
Minecraft's now-rewritten GpuDevice-based rendering backend. The original mod's
direct-state-access VBO/EBO/FBO system has no equivalent in this version's
renderer and is not included. Not affiliated with or endorsed by GPUBooster's
original author.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[26.1.2,)" #mandatory
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
